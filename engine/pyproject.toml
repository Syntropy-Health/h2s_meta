[project]
name = "daypart-engine"
version = "0.1.0"
description = "Daypart Engine — adherence intelligence engine (hackathon build on pinned LHM)."
requires-python = ">=3.12"
dependencies = [
    # D8: pinned LHM SDK with the scoring extra. Pre-existing Syntropy code (R12).
    "syntropy-lhm[lhm-scoring] @ git+https://github.com/Syntropy-Health/lhm@4821dc74406de21a0e5274892be433f00d6f0ad0",
    "numpy>=2,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    # D16: aviary is the primary virtual-environment framework.
    "fhaviary>=0.37,<0.38",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["daypart*"]

[tool.setuptools.package-data]
"daypart.membrane" = ["rules/*.yaml"]
"daypart.eval" = ["runs.yaml"]

[tool.pytest.ini_options]
addopts = ""
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
