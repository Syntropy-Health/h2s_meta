name: deploy-demo

# Redeploys the hosted Daypart demo (FastAPI playground + Streamlit results dashboard) to Modal
# after the engine suite passes on the staging trunk (daypart/build) or main.
on:
  workflow_run:
    workflows: [engine]
    types: [completed]
    branches: [main, daypart/build]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_IMAGE_BUILDER_VERSION: "2025.06"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Deploy to Modal
        run: uv run --no-project --with modal==1.6.3 modal deploy deploy/modal_demo.py
      - name: Smoke the public endpoints
        run: |
          P=https://supermomo668--daypart-demo-playground.us-east.modal.run
          curl -fsS -m 180 "$P/api/health"
          curl -fsS -m 180 -o /dev/null "$P/"
          curl -fsS -m 180 -o /dev/null https://supermomo668--daypart-demo-dashboard.us-east.modal.run/_stcore/health
